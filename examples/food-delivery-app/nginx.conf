server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers (tune CSP to your API/auth hosts)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://*.food.example.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  # Hashed bundles are immutable -> cache for a year
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or users get stale bundle references after a deploy
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback: deep links like /orders/o1001 must serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
